name: StillApple
options:
  bundleIdPrefix: dev.still
  deploymentTarget:
    iOS: '15.0'
    macOS: '12.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_ENTITLEMENTS: Still.entitlements
    INFOPLIST_KEY_CFBundleDisplayName: Still
targets:
  StillIOS:
    type: application
    platform: iOS
    sources:
      - StillApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.still.dns.companion.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  StillMac:
    type: application
    platform: macOS
    sources:
      - StillApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.still.dns.companion.macos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
schemes:
  StillIOS:
    build:
      targets:
        StillIOS: all
  StillMac:
    build:
      targets:
        StillMac: all
